# Netlify build settings. The site is static: data and app files are built into site/ on every deploy.
[build]
  command = "(node scripts/fetch-garages.mjs || echo using committed data/garages.json) && node scripts/check-design.mjs && node scripts/validate.mjs && node scripts/build-app-data.mjs && node scripts/test-lookup.mjs && node scripts/test-engine.mjs && node scripts/test-import.mjs && SITE_OUT=site/ node scripts/build-site.mjs"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"

# Service worker and data must never be cached stale by the CDN.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/data.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/garages.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), interest-cohort=()"
    # Content-Security-Policy is per page, with script hashes: scripts/build-site.mjs writes it to site/_headers.
