name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/check-design.mjs
      - run: node scripts/validate.mjs
      - run: node scripts/build-app-data.mjs
      - run: node scripts/test-lookup.mjs
      - run: node scripts/test-engine.mjs
      - run: node scripts/test-import.mjs
      - run: node scripts/build-site.mjs
