name: Build site from data and app
# Runs when data/ or app/ change on main: validates, rebuilds data.js and the site files at the
# repository root (served by GitHub Pages), and commits them back. Pushes made by this workflow
# use GITHUB_TOKEN, so they do not trigger workflows again.
on:
  push:
    branches: [main]
    paths: ["data/**", "app/**", "scripts/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/check-design.mjs
      - run: node scripts/validate.mjs
      - run: node scripts/build-app-data.mjs
      - run: node scripts/test-lookup.mjs
      - run: node scripts/build-site.mjs
      - name: Commit built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html data.js lookup.js manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png app/data.js styles welcome
          if git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "Build site from data [skip ci]" && git push; fi
